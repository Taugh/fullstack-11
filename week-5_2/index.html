<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<title>Event Listeners</title>
</head>
<body>
	<nav>
		<button class="screen-mode">Dark Mode</button>
	</nav>
	<main>
		<div class="form-wrapper">
			<form action="" class="auth-form" method="get">
				<input type="email" name="email" class="email" placeholder="Enter email">
				<input type="password" name="pwd" class="pwd" placeholder="Enter password">
				<button type="submit" class="authBtn">Go</button>
			</form>
		</div>
		<div class="output"></div>
	</main>
	<footer>
		<p class="copyright"></p>
	</footer>
	<script src="app.js"></script>
</body>
</html>
