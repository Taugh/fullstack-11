<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Pokédex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>LLM Pokédex</h1>
        <p>Search for any Pokémon by name or Pokédex number</p>
    </header>

    <main>

        <!-- Search Area -->
        <section class="search-section">
            <form id="search-form">
                <label for="pokemon-input">Search Pokémon</label>

                <input
                    type="text"
                    id="pokemon-input"
                    placeholder="Enter name or Pokédex number"
                    required
                >

                <div class="button-group">
                    <button type="submit">Search</button>
                    <button type="button" id="random-btn" class="secondary-btn">Random</button>
                    <button type="button" id="clear-btn" class="secondary-btn">Clear</button>
                </div>
            </form>
        </section>

        <!-- Messages / Errors -->
        <section id="message-area">
            <!-- JS will display messages here -->
        </section>

        <!-- Pokémon Display Area -->
        <section id="pokemon-display">
            <!-- JS will dynamically create Pokémon cards here -->
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
