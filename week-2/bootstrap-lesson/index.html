<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="style.css">
	<title>Bootstrap Lesson</title>
</head>

<body>
	<nav class="navbar navbar-expand-lg bg-light">
		<div class="container-fluid">
			<a class="navbar-brand" href="#">Fullstack 11</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
				aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNavDropdown">
				<ul class="navbar-nav">
					<li class="nav-item">
						<a class="nav-link active" aria-current="page" href="#">Home</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="#">Roster</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="#">Contact Us</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>

	<main>

		<section class="form-shell">
			<div class="container">
				<div class="account-card">
					<form class="row g-4">
						<div class="col-md-6">
							<label for="firstName" class="form-label fs-5 fw-semibold">First name</label>
							<input type="text" class="form-control form-control-lg" id="firstName">
						</div>
						<div class="col-md-6">
							<label for="lastName" class="form-label fs-5 fw-semibold">Last name</label>
							<input type="text" class="form-control form-control-lg" id="lastName">
						</div>
						<div class="col-md-6">
							<label for="dob" class="form-label fs-5 fw-semibold">Date of birth</label>
							<input type="text" class="form-control form-control-lg" id="dob" placeholder="mm/dd/yyyy">
						</div>
						<div class="col-md-6">
							<label for="ssn" class="form-label fs-5 fw-semibold">Social Security Number</label>
							<input type="text" class="form-control form-control-lg" id="ssn">
						</div>
						<div class="col-12">
							<label for="phone" class="form-label fs-5 fw-semibold">Phone number</label>
							<input type="tel" class="form-control form-control-lg" id="phone">
						</div>
						<div class="col-12">
							<label for="address" class="form-label fs-5 fw-semibold">Address</label>
							<input type="text" class="form-control form-control-lg" id="address">
						</div>
						<div class="col-md-6">
							<label for="city" class="form-label fs-5 fw-semibold">City</label>
							<input type="text" class="form-control form-control-lg" id="city">
						</div>
						<div class="col-md-6">
							<label for="state" class="form-label fs-5 fw-semibold">State</label>
							<input type="text" class="form-control form-control-lg" id="state">
						</div>
						<div class="col-12">
							<label for="zip" class="form-label fs-5 fw-semibold">ZIP code</label>
							<input type="text" class="form-control form-control-lg" id="zip">
						</div>
						<div class="col-12">
							<div class="form-check terms-check">
								<input class="form-check-input" type="checkbox" id="terms">
								<label class="form-check-label fs-5 fw-semibold" for="terms">I agree to the Terms</label>
							</div>
						</div>
						<div class="col-12">
							<button type="submit" class="btn btn-primary btn-lg w-100 fs-4 fw-semibold submit-btn">Create Account</button>
						</div>
					</form>
				</div>
			</div>
		</section>
	</main>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>

</html>
